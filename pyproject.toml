[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-local-rag"
version = "1.0.0"
description = "Offline document Q&A assistant powered by Microsoft Foundry Local and SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.24,<3",
  "pypdf>=5,<6",
]

[project.optional-dependencies]
windows = ["foundry-local-sdk-winml"]
cross-platform = ["foundry-local-sdk"]
ui = ["streamlit>=1.45,<2"]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "fpdf2>=2.7,<3"]

[project.scripts]
local-rag = "local_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

